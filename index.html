<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Controle de Marcações</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef2f7; --card: #ffffff; --txt: #1f2937; --muted: #6b7280;
    --navy: #1f3a5f; --btn: #1f3a5f; --btn-txt: #ffffff; --line: #d9e0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --card: #1e293b; --txt: #e5e7eb; --muted: #9ca3af;
      --navy: #93b4e6; --btn: #3b6fb6; --btn-txt: #ffffff; --line: #334155;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--txt);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 480px; text-align: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 36px 28px;
  }
  .marca { font-size: 13px; letter-spacing: .12em; color: var(--muted); margin: 0 0 18px; }
  h1 { font-size: 24px; margin: 0 0 12px; color: var(--navy); }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 14px; }
  .contato {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 15px; color: var(--muted);
  }
  .contato strong { color: var(--txt); }
</style>
</head>
<body>
  <main class="card">
    <p class="marca">CONTROLE DE MARCAÇÕES</p>
    <h1>Período de teste encerrado.</h1>
    </p>
  </main>
</body>
</html>
